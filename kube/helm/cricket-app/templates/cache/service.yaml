apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: {{ include "cricket-app.namespace" . }}
  labels:
    app: cache
    {{- include "cricket-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cache.service.type }}
  selector:
    app: cache
  ports:
    - port: {{ .Values.cache.service.port }}
      targetPort: {{ .Values.cache.containerPort }}
      protocol: TCP
      name: redis
