apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: {{ include "cricket-app.namespace" . }}
  labels:
    app: database
    {{- include "cricket-app.labels" . | nindent 4 }}
spec:
  serviceName: database
  replicas: {{ .Values.database.replicaCount }}
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
        {{- include "cricket-app.labels" . | nindent 8 }}
    spec:
      containers:
        - name: database
          image: {{ include "cricket-app.image" (dict "registry" .Values.global.ecrRegistry "environment" .Values.global.environment "repository" .Values.database.image.repository "tag" .Values.database.image.tag) }}
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.database.containerPort }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cricket-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: {{ .Values.database.resources.requests.cpu }}
              memory: {{ .Values.database.resources.requests.memory }}
            limits:
              cpu: {{ .Values.database.resources.limits.cpu }}
              memory: {{ .Values.database.resources.limits.memory }}
          {{- if .Values.database.persistence.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          {{- end }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.env.postgresUser }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.env.postgresUser }}
            initialDelaySeconds: 30
            periodSeconds: 10
  {{- if .Values.database.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.database.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
  {{- end }}
