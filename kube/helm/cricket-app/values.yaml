# =============================================================================
#  values.yaml — Default values for the MemeCricket Helm chart
#  Override per environment using values-dev.yaml, values-qa.yaml, values-prod.yaml
# =============================================================================

global:
  environment: dev
  namespace: cricket
  ecrRegistry: ""  # Set via Jenkins pipeline: --set global.ecrRegistry=<account_id>.dkr.ecr.<region>.amazonaws.com

# ========== Frontend (React + Nginx) ==========
frontend:
  replicaCount: 1
  image:
    repository: frontend
    tag: latest
    pullPolicy: Always
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  env:
    backendUrl: "backend.cricket.svc.cluster.local:3001"
  resources:
    requests:
      cpu: 128m
      memory: 128Mi
    limits:
      cpu: 256m
      memory: 256Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

# ========== Backend (Node.js API) ==========
backend:
  replicaCount: 1
  image:
    repository: backend
    tag: latest
    pullPolicy: Always
  containerPort: 3001
  service:
    type: ClusterIP
    port: 3001
  env:
    port: "3001"
    databaseUrl: ""      # Injected via --set or secrets
    redisUrl: ""         # Injected via --set or secrets
    adminPassword: ""    # Injected via --set or secrets
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 256m
      memory: 512Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

# ========== Database (PostgreSQL) ==========
database:
  replicaCount: 1
  image:
    repository: db
    tag: latest
    pullPolicy: Always
  containerPort: 5432
  service:
    type: ClusterIP
    port: 5432
  env:
    postgresDb: cricket_db
    postgresUser: cricket
    postgresPassword: ""  # Injected via --set or secrets
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp2
  resources:
    requests:
      cpu: 256m
      memory: 512Mi
    limits:
      cpu: 512m
      memory: 1024Mi

# ========== Cache (Redis) ==========
cache:
  replicaCount: 1
  image:
    repository: cache
    tag: latest
    pullPolicy: Always
  containerPort: 6379
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 64m
      memory: 64Mi
    limits:
      cpu: 128m
      memory: 128Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

# ========== Ingress (AWS ALB) ==========
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
  host: ""  # Leave empty for ALB DNS
